# FixDock feedback relay. Secrets (never committed):
#   wrangler secret put BUG_WEBHOOK
#   wrangler secret put IDEA_WEBHOOK
name = "fixdock-feedback"
main = "src/index.js"
compatibility_date = "2026-10-01"
